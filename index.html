<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <style>
      .bar {
        fill: steelblue;
      }
      .bar:hover {
        fill: orange;
      }
      .axis-label {
        font-size: 12px;
        fill: #333;
      }
    </style>
  </head>
  <body>
    <a href="about.html">About Me - A propos de moi</a>
    <h1>Hello World!</h1>
    <p>This is my very first website.</p>
    <a href="https://github.com/StephRoos/first-website">View source on Github</a>

    <h2>Bar Chart</h2>
    <div id="chart"></div>

    <script>
      const data = [
        { name: "A", value: 1 },
        { name: "B", value: 5 },
        { name: "C", value: 8 },
        { name: "D", value: 10 }
      ];

      const width = 480;
      const height = 300;
      const margin = { top: 20, right: 20, bottom: 40, left: 50 };

      const svg = d3
        .select("#chart")
        .append("svg")
        .attr("width", width)
        .attr("height", height);

      const x = d3
        .scaleBand()
        .domain(data.map((d) => d.name))
        .range([margin.left, width - margin.right])
        .padding(0.2);

      const y = d3
        .scaleLinear()
        .domain([0, d3.max(data, (d) => d.value)])
        .nice()
        .range([height - margin.bottom, margin.top]);

      svg
        .append("g")
        .attr("transform", `translate(0, ${height - margin.bottom})`)
        .call(d3.axisBottom(x));

      svg
        .append("g")
        .attr("transform", `translate(${margin.left}, 0)`)
        .call(d3.axisLeft(y));

      svg
        .append("g")
        .selectAll("rect")
        .data(data)
        .join("rect")
        .attr("class", "bar")
        .attr("x", (d) => x(d.name))
        .attr("y", (d) => y(d.value))
        .attr("width", x.bandwidth())
        .attr("height", (d) => y(0) - y(d.value));

      svg
        .append("g")
        .selectAll("text")
        .data(data)
        .join("text")
        .attr("class", "axis-label")
        .attr("x", (d) => x(d.name) + x.bandwidth() / 2)
        .attr("y", (d) => y(d.value) - 6)
        .attr("text-anchor", "middle")
        .text((d) => d.value);
    </script>
  </body>
</html>
